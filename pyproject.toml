[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habconn"
version = "0.1.0"
description = "Habitat connectivity optimization with reinforcement learning and Graphab"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Project Team" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "shapely>=2.0",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
train = [
  "stable-baselines3>=2.0",
  "sb3-contrib>=2.0",
  "torch>=2.0",
  "tensorboard>=2.13",
]
dev = [
  "pytest>=7.0",
  "stable-baselines3>=2.0",
  "sb3-contrib>=2.0",
  "torch>=2.0",
  "tensorboard>=2.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
